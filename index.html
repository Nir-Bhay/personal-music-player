<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodify - Your Music Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>Melodify</h1>
            </div>
            <nav>
                <ul>
                    <li class="active"><i class="fas fa-home"></i> Home</li>
                    <li><i class="fas fa-heart"></i> Favorites</li>
                    <li><i class="fas fa-history"></i> History</li>
                </ul>
            </nav>
            <div class="theme-toggle">
                <i class="fas fa-moon"></i>
                <span>Dark Mode</span>
            </div>
        </div>

        <div class="main-content">
            <div class="search-container">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search" placeholder="Search for music...">
                </div>
            </div>

            <div class="tab-content active" id="home-tab">
                <div class="now-playing-section">
                    <iframe id="player" style="display:none;" width="560" height="315" frameborder="0"
                        allowfullscreen></iframe>
                    <div class="player-controls">
                        <button id="prev-btn"><i class="fas fa-step-backward"></i></button>
                        <button id="play-btn"><i class="fas fa-play"></i></button>
                        <button id="next-btn"><i class="fas fa-step-forward"></i></button>
                    </div>
                </div>

                <div class="results-section">
                    <h2>Search Results</h2>
                    <ul id="results" class="media-list"></ul>
                </div>
            </div>

            <div class="tab-content" id="favorites-tab">
                <h2>Your Favorites</h2>
                <div class="favorites-grid" id="favorites"></div>
            </div>

            <div class="tab-content" id="history-tab">
                <div class="history-header">
                    <h2>Listening History</h2>
                    <button onclick="clearHistory()" class="clear-btn"><i class="fas fa-trash"></i> Clear</button>
                </div>
                <ul id="history" class="media-list"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>

</html>
